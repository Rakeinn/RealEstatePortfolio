<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>

  <!-- Architectural Background Grid Accent -->
  <circle cx="600" cy="390" r="290" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <circle cx="600" cy="390" r="380" fill="none" stroke="rgba(255,255,255,0.03)" stroke-dasharray="6 6" />

  
    <!-- CAD Blueprint Floorplan -->
    <g transform="translate(600, 390)" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none">
      <rect x="-240" y="-140" width="480" height="280" rx="4" fill="rgba(255,255,255,0.03)" />
      <!-- Rooms Partition -->
      <line x1="-240" y1="0" x2="60" y2="0" />
      <line x1="60" y1="-140" x2="60" y2="140" />
      <line x1="-90" y1="0" x2="-90" y2="140" />
      <!-- Terrace Curve -->
      <path d="M 60 -140 Q 240 -140 240 0 T 60 140" fill="rgba(56, 189, 248, 0.05)" stroke="#38bdf8" />
      <!-- Room Labels -->
      <text x="-160" y="-60" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" stroke="none">MASTER SUITE</text>
      <text x="-160" y="70" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" stroke="none">LIVING SALON</text>
      <text x="120" y="5" fill="#38bdf8" font-family="sans-serif" font-size="11" stroke="none">SKY TERRACE</text>
    </g>

  <!-- Header Badge -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="190" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="95" y="20" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">ARCHITECTURAL BLUEPRINT</text>
  </g>

  <!-- Editorial Info Card at Bottom -->
  <g transform="translate(60, 640)">
    <rect x="0" y="0" width="1080" height="100" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="40" y="44" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#ffffff">Duplex Sky Villa 4,850 Sq Ft</text>
    <text x="40" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Chelsea • New York</text>
    <text x="1040" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="end" letter-spacing="2">RECENT GROUP</text>
  </g>
</svg>